<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Role Models - HabitRack</title>
    <link
      rel="icon"
      type="image/x-icon"
      href="../../assets/images/optimized/HabitRack.webp"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300..700&family=Geist+Mono:wght@100..900&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
    <link rel="stylesheet" href="../../css/app/nav.css" />
    <link rel="stylesheet" href="../../css/app/style.css" />
    <link rel="stylesheet" href="../../css/app/modal.css" />
    <link rel="stylesheet" href="../../css/app/profile.css" />
    <link rel="stylesheet" href="../../css/app/role-models.css" />
    <link rel="stylesheet" href="../../css/base/general.css" />
  </head>
  <body>
    <div class="nav-overlay" id="navOverlay" aria-hidden="true"></div>
    <button
      class="nav-toggle"
      id="navToggle"
      type="button"
      aria-label="Open navigation"
      aria-expanded="false"
      aria-controls="mainNav"
    >
      <ion-icon name="menu-outline"></ion-icon>
    </button>

    <div class="app-container">
      <nav class="nav" id="mainNav">
        <a href="../../index.html" class="nav-logo d-flex">
          <img src="../../assets/images/optimized/HabitRack.webp" alt="" />
          <h2>HabitRack</h2>
        </a>
        <ul class="nav-menu">
          <li class="unselected nav-item">
            <div class="unselected-square"></div>
            <a href="habits.html">All Habits</a>
          </li>
          <li class="unselected nav-item">
            <div class="unselected-square"></div>
            <a href="progress.html">Your progress</a>
          </li>
          <li class="unselected nav-item">
            <div class="unselected-square"></div>
            <a href="achievements.html">Achievements</a>
          </li>
          <li class="unselected nav-item">
            <div class="unselected-square"></div>
            <a href="shop.html">Shop</a>
          </li>
          <li class="selected nav-item">
            <div class="square"></div>
            <a href="role-models.html">Role Models</a>
          </li>
        </ul>
        <div class="nav-footer">
          <div class="profile-wrapper" id="profileWrapper">
            <button
              class="profile"
              id="profileToggle"
              type="button"
              aria-expanded="false"
              aria-controls="profileMenu"
            >
              <img
                class="profile-photo"
                id="profilePhoto"
                src="../../assets/images/optimized/profile.webp"
                alt="Profile photo"
              />
              <span class="profile-name">
                <span class="profile-display-name" id="profileDisplayName"
                  >username</span
                >
                <ion-icon class="arrow" name="chevron-down-outline"></ion-icon>
              </span>
            </button>
            <div class="profile-menu" id="profileMenu" aria-hidden="true">
              <ul class="profile-list">
                <li>
                  <button
                    class="profile-item"
                    type="button"
                    data-profile-action="profile"
                  >
                    Profile
                  </button>
                </li>
                <li>
                  <button
                    class="profile-item"
                    type="button"
                    data-profile-action="settings"
                  >
                    Settings
                  </button>
                </li>
                <li>
                  <button
                    class="profile-item profile-item-themes"
                    type="button"
                    data-profile-action="themes"
                  >
                    Your themes
                  </button>
                </li>
                <li>
                  <button
                    class="profile-item profile-item-signout"
                    type="button"
                    data-profile-action="signout"
                  >
                    Sign out
                  </button>
                </li>
              </ul>
            </div>
          </div>
          <button
            class="theme"
            id="themeToggle"
            type="button"
            aria-label="Switch theme"
            data-theme-toggle
          >
            <ion-icon name="sunny-outline"></ion-icon>
          </button>
        </div>
      </nav>

      <main class="main">
        <div class="glow"></div>
        <div class="roles-wrapper">
          <header class="roles-header">
            <div>
              <span class="roles-eyebrow mono-text"
                >INSPIRATION / PRACTICE</span
              >
              <h1>Role Models</h1>
              <p>Habits that shaped people who showed up every day.</p>
            </div>
          </header>

          <div
            class="roles-filter"
            id="roles-filter"
            role="group"
            aria-label="Filter role models"
          >
            <button class="active" type="button" data-cat="all">All</button>
            <button type="button" data-cat="prophetic">Prophetic</button>
            <button type="button" data-cat="companions">Companions</button>
            <button type="button" data-cat="business">Business</button>
            <button type="button" data-cat="history">History</button>
          </div>

          <div class="roles-grid" id="roles-grid"></div>
        </div>
      </main>
    </div>

    <dialog class="role-dialog" id="role-dialog" aria-labelledby="rd-habit">
      <article class="role-detail">
        <button
          class="role-detail-close"
          id="rd-close"
          type="button"
          aria-label="Close details"
        >
          <ion-icon name="close-outline"></ion-icon>
        </button>
        <span class="role-detail-cat mono-text" id="rd-cat"></span>
        <h2 id="rd-person"></h2>
        <h3 id="rd-habit"></h3>
        <div class="role-detail-certainty" id="rd-cert"></div>
        <dl class="role-detail-list">
          <div>
            <dt>How it worked</dt>
            <dd id="rd-how"></dd>
          </div>
          <div>
            <dt>What it produced</dt>
            <dd id="rd-results"></dd>
          </div>
          <div>
            <dt>Consistency</dt>
            <dd id="rd-consistency"></dd>
          </div>
          <div>
            <dt>Source</dt>
            <dd id="rd-source"></dd>
          </div>
        </dl>
        <button class="role-add-habit" id="rd-add" type="button">
          <ion-icon name="add-outline"></ion-icon>
          Add as a habit
        </button>
      </article>
    </dialog>

    <div
      class="role-toast"
      id="role-toast"
      role="status"
      aria-live="polite"
    ></div>

    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>
    <script
      type="module"
      src="https://unpkg.com/ionicons@8.0.13/dist/ionicons/ionicons.esm.js"
    ></script>
    <script
      nomodule
      src="https://unpkg.com/ionicons@8.0.13/dist/ionicons/ionicons.js"
    ></script>
    <script src="../../js/app/data.js"></script>
    <script src="../../js/app/profile.js"></script>
    <script src="../../js/app/navigation.js"></script>
    <script src="../../js/app/role-models.js"></script>
  </body>
</html>
