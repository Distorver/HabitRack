<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>All Habits - HabitRack</title>
    <link
      rel="icon"
      type="image/x-icon"
      href="../../assets/images/compressed/HabitRack.webp"
    />

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300..700&family=Geist+Mono:wght@100..900&display=swap"
      rel="stylesheet"
    />

    <!-- Bootstrap 5 CSS -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />

    <!-- App CSS -->
    <link rel="stylesheet" href="../../css/app/nav.css" />
    <link rel="stylesheet" href="../../css/app/style.css" />
    <link rel="stylesheet" href="../../css/app/header.css" />
    <link rel="stylesheet" href="../../css/app/stats.css" />
    <link rel="stylesheet" href="../../css/app/habits-grid.css" />
    <link rel="stylesheet" href="../../css/app/habit-card.css" />
    <link rel="stylesheet" href="../../css/app/modal.css" />
    <link rel="stylesheet" href="../../css/general.css" />
  </head>
  <body>
    <!-- Nav Overlay (mobile) -->
    <div class="nav-overlay" id="navOverlay"></div>

    <!-- Mobile Nav Toggle -->
    <button class="nav-toggle" id="navToggle">
      <ion-icon name="menu-outline"></ion-icon>
    </button>

    <div class="app-container">
      <!-- ========== SIDEBAR NAV ========== -->
      <nav class="nav" id="mainNav">
        <a href="../../index.html" class="nav-logo d-flex">
          <img src="../../assets/images/compressed/HabitRack.webp" alt="" />
          <h2>HabitRack</h2>
        </a>
        <ul class="nav-menu">
          <li class="selected nav-item">
            <div class="square"></div>
            <a href="habits.html">All Habits</a>
          </li>
          <li class="unselected nav-item">
            <div class="unselected-square"></div>
            <a href="progress.html">Your progress</a>
          </li>
          <li class="unselected nav-item">
            <div class="unselected-square"></div>
            <a href="achievments.html">Achievments</a>
          </li>
          <li class="unselected nav-item">
            <div class="unselected-square"></div>
            <a href="shop.html">Shop</a>
          </li>
        </ul>
        <div class="nav-footer">
          <div class="profile d-flex">
            <img
              class="profile-photo"
              src="../../assets/images/raw/profile.jpg"
              alt=""
            />
            <div class="profile-name">
              username
              <ion-icon class="arrow" name="chevron-down-outline"></ion-icon>
            </div>
          </div>
          <button class="theme">
            <ion-icon name="sunny-outline"></ion-icon>
          </button>
        </div>
      </nav>

      <!-- ========== MAIN CONTENT ========== -->
      <main class="main">
        <div class="glow"></div>

        <div class="page-container">
          <!-- Header Section -->
          <header class="main-header">
            <div class="header-content">
              <h1 class="header-title">Your Habits</h1>
              <p class="header-subtitle">
                Track your daily progress and build consistency.
              </p>
            </div>
            <div class="header-actions">
              <div class="time-filter">
                <button class="active" data-days="7">7 days</button>
                <button data-days="30">30 days</button>
              </div>
              <button class="btn-add-habit" id="btnAddHabit">
                ADD HABIT
                <ion-icon name="add-outline"></ion-icon>
              </button>
            </div>
          </header>

          <!-- Statistics Cards -->
          <div class="stats-container" id="statsContainer">
            <!-- Rendered by JS -->
          </div>

          <!-- Habits Grid -->
          <section class="habits-section">
            <div class="habits-grid" id="habitsGrid">
              <!-- Rendered by JS -->
            </div>
          </section>
        </div>
      </main>

      <!-- ========== ADD HABIT MODAL ========== -->
      <div class="modal-overlay" id="modalOverlay">
        <div class="modal-container" id="habitModal">
          <div class="modal-header">
            <h2>Add New Habit</h2>
            <button class="btn-close-modal" id="btnCloseModal">
              <ion-icon name="close-outline"></ion-icon>
            </button>
          </div>
          <form class="habit-form" id="habitForm">
            <!-- Habit Name -->
            <div class="form-group">
              <label for="habitName">Habit Name</label>
              <input
                type="text"
                id="habitName"
                class="form-control"
                placeholder="e.g., Drink Water, Exercise"
                required
              />
            </div>

            <!-- Icon Picker -->
            <div class="form-group">
              <label>Choose Icon</label>
              <div class="icon-picker" id="iconPicker">
                <!-- Rendered by JS -->
              </div>
              <input type="hidden" id="selectedIcon" value="leaf" />
            </div>

            <!-- Goal Type -->
            <div class="form-group">
              <label>Goal Type</label>
              <div class="goal-type-toggle">
                <button
                  type="button"
                  class="goal-type-btn active"
                  data-goal-type="boolean"
                >
                  Yes/No
                </button>
                <button
                  type="button"
                  class="goal-type-btn"
                  data-goal-type="numeric"
                >
                  Numeric
                </button>
              </div>
            </div>

            <!-- Goal Value (for numeric) -->
            <div class="form-group" id="goalTypeContainer">
              <label for="habitGoal">Goal</label>
              <input
                type="text"
                id="habitGoal"
                class="form-control"
                value="Daily tracking"
                disabled
              />
            </div>

            <!-- Submit -->
            <button type="submit" class="btn-submit-habit">Create Habit</button>
          </form>
        </div>
      </div>

      <!-- ========== SCRIPTS ========== -->
      <script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"
      ></script>
      <script
        type="module"
        src="https://unpkg.com/ionicons@8.0.13/dist/ionicons/ionicons.esm.js"
      ></script>
      <script
        nomodule
        src="https://unpkg.com/ionicons@8.0.13/dist/ionicons/ionicons.js"
      ></script>

      <!-- App JS -->
      <script src="../../js/app/data.js"></script>
      <script src="../../js/app/modal.js"></script>
      <script src="../../js/app/habits.js"></script>

      <!-- Initialize -->
      <script>
        document.addEventListener("DOMContentLoaded", function () {
          Modal.init();
          Habits.init();

          // Mobile nav toggle
          const navToggle = document.getElementById("navToggle");
          const mainNav = document.getElementById("mainNav");
          const navOverlay = document.getElementById("navOverlay");

          if (navToggle && mainNav) {
            const toggleNav = function () {
              mainNav.classList.toggle("active");
              if (navOverlay) {
                navOverlay.classList.toggle("active");
              }
            };

            navToggle.addEventListener("click", toggleNav);

            // Close nav when clicking overlay
            if (navOverlay) {
              navOverlay.addEventListener("click", toggleNav);
            }
          }
        });
      </script>
    </div>
  </body>
</html>
