<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login - HabitRack</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300..700&family=Geist+Mono:wght@100..900&display=swap"
      rel="stylesheet"
    />

    <!-- Bootstrap 5 CSS -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />

    <!-- HabitRack Global Stylesheet -->
    <link rel="stylesheet" href="../../css/style.css" />

    <!-- Login Module Stylesheet -->
    <link rel="stylesheet" href="login.css" />
  </head>

  <body class="bg-black text-white min-vh-100 d-flex flex-column">
    <!-- Navbar -->
    <header class="border-bottom border-dark py-3">
      <div class="container d-flex justify-content-between align-items-center">
        <a href="../../index.html" class="d-flex align-items-center gap-2 text-decoration-none text-white">
          <img src="../../assets/images/raw/HabitRack.png" alt="HabitRack Logo" height="40" />
          <span class="fs-4 fw-bold auth-brand-text">HabitRack</span>
        </a>
        <a href="signup.html" class="button button-orange rounded-0 py-2 px-3 fs-6">
          Sign Up
        </a>
      </div>
    </header>

    <!-- Main Content -->
    <main class="flex-grow-1 d-flex align-items-center py-5">
      <div class="container">
        <div class="row justify-content-center">
          <div class="col-12 col-md-8 col-lg-5">
            <!-- Login Card -->
            <div class="card auth-card rounded-0 p-4 p-sm-5 shadow">
              <div class="card-body p-0">
                <!-- Title & Square Accent -->
                <div class="d-flex align-items-center gap-2 mb-2">
                  <span class="square-icon"></span>
                  <span class="text-uppercase fw-semibold auth-badge-label">
                    Welcome Back
                  </span>
                </div>
                <h2 class="fw-bold mb-2">Log In</h2>
                <p class="text-secondary mb-4 auth-subtitle">
                  Enter your details to track your daily habits and keep your streak alive.
                </p>

                <!-- Login Form -->
                <form action="#" method="POST">
                  <!-- Email -->
                  <div class="mb-3">
                    <label for="email" class="form-label auth-form-label">
                      Email Address
                    </label>
                    <input
                      type="email"
                      id="email"
                      name="email"
                      class="form-control rounded-0 py-2"
                      placeholder="name@example.com"
                      required
                    />
                  </div>

                  <!-- Password -->
                  <div class="mb-3">
                    <div class="d-flex justify-content-between align-items-center">
                      <label for="password" class="form-label auth-form-label">
                        Password
                      </label>
                      <a href="#" class="text-decoration-none text-secondary small auth-forgot-link">
                        Forgot?
                      </a>
                    </div>
                    <input
                      type="password"
                      id="password"
                      name="password"
                      class="form-control rounded-0 py-2"
                      placeholder="Enter your password"
                      required
                    />
                  </div>

                  <!-- Remember Me -->
                  <div class="mb-4 form-check">
                    <input type="checkbox" class="form-check-input rounded-0" id="rememberMe" />
                    <label class="form-check-label text-secondary small" for="rememberMe">
                      Keep me logged in
                    </label>
                  </div>

                  <!-- Submit Button -->
                  <button type="submit" class="button button-orange w-100 rounded-0 py-2 fw-bold mb-3">
                    LOG IN
                  </button>

                  <!-- Divider -->
                  <div class="d-flex align-items-center text-secondary my-3 small auth-divider">
                    <hr class="flex-grow-1 border-secondary" />
                    <span class="px-2">OR</span>
                    <hr class="flex-grow-1 border-secondary" />
                  </div>

                  <!-- Social Logins -->
                  <div class="row g-2 mb-4">
                    <div class="col-6">
                      <button type="button" class="btn social-btn w-100 rounded-0 py-2 small">
                        Google
                      </button>
                    </div>
                    <div class="col-6">
                      <button type="button" class="btn social-btn w-100 rounded-0 py-2 small">
                        GitHub
                      </button>
                    </div>
                  </div>

                  <!-- Connect to Signup -->
                  <div class="text-center pt-2 border-top border-dark">
                    <p class="text-secondary small mb-0">
                      Don't have an account?
                      <a href="signup.html" class="text-white text-decoration-underline fw-semibold">
                        Sign up here
                      </a>
                    </p>
                  </div>
                </form>
              </div>
            </div>

            <!-- Back to Home Link -->
            <div class="text-center mt-4">
              <a href="../../index.html" class="text-secondary text-decoration-none small auth-back-link">
                ← Back to Home
              </a>
            </div>
          </div>
        </div>
      </div>
    </main>

    <!-- Footer -->
    <footer class="border-top border-dark py-3 text-center text-secondary small auth-footer">
      <div class="container">
        &copy; 2026 HabitRack. All rights reserved.
      </div>
    </footer>

    <!-- Bootstrap 5 JS Bundle -->
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>
  </body>
</html>
