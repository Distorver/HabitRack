<!doctype html>
<html lang="en" data-bs-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Contact - HabitRack</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300..700&family=Geist+Mono:wght@400..700&display=swap"
      rel="stylesheet"
    />

    <!-- Bootstrap CSS -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <!-- Website CSS -->
    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="css/media.css" />

    <style>
      a {
        text-decoration: none;
      }

      .nav-link {
        padding: 0;
      }

      .form-control:focus {
        border-color: var(--color-orange);
        box-shadow: 0 0 0 0.25rem rgba(253, 85, 29, 0.25);
      }
    </style>
  </head>

  <body>
    <!-- ========== CONTACT FORM START ========== -->
    <main class="py-5" style="min-height: calc(100vh - 76px - 300px)">
      <div class="container py-4">
        <div class="row justify-content-center">
          <div class="col-12 col-md-8 col-lg-6">
            <h1 class="text-white fw-bold mb-3">Contact Us</h1>
            <p class="text-secondary mb-4">
              Have questions, feedback, or need help? Send us a message below.
            </p>

            <form action="#" method="POST">
              <div class="mb-3">
                <label for="name" class="form-label text-white">Name</label>
                <input
                  type="text"
                  class="form-control rounded-0"
                  id="name"
                  name="name"
                  placeholder="Your Name"
                  required
                />
              </div>

              <div class="mb-3">
                <label for="email" class="form-label text-white">Email</label>
                <input
                  type="email"
                  class="form-control rounded-0"
                  id="email"
                  name="email"
                  placeholder="name@example.com"
                  required
                />
              </div>

              <div class="mb-4">
                <label for="message" class="form-label text-white">Message</label>
                <textarea
                  class="form-control rounded-0"
                  id="message"
                  name="message"
                  rows="5"
                  placeholder="Your Message..."
                  required
                ></textarea>
              </div>

              <button type="submit" class="button button-orange w-100">
                Send Message
              </button>
            </form>
          </div>
        </div>
      </div>
    </main>
    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
