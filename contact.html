<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300..700&display=swap"
      rel="stylesheet"
    />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Geist+Mono:ital,wght@0,100..900;1,100..900&display=swap"
      rel="stylesheet"
    />

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />

    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      .contact-form {
        background-color: #141414;
        color: #fff;
        font-family: "Geist Mono", monospace;
      }

      .btn {
        background-color: #fd551d !important;
        color: #141414 !important;
      }

      .btn:hover {
        background-color: #fd551d !important;
      }

      h2 {
        font-family: "Space Grotesk";
        font-size: calc(2rem + 2vw);
      }

      label {
        font-size: 1.2rem;
      }

      input,
      textarea {
        background-color: #141414 !important;
      }

      input::placeholder,
      textarea::placeholder {
        color: #757575 !important;
      }

      .contact-form {
        position: relative;
      }

      .square {
        width: 2rem;
        height: 2rem;
        background-color: #fd551d;
        position: absolute;
      }

      .square-one {
        top: 2rem;
        left: 2rem;
      }

      .square-two {
        bottom: 2rem;
        left: 2rem;
      }

      .square-three {
        right: 2rem;
        top: 2rem;
      }

      .square-four {
        right: 2rem;
        bottom: 2rem;
      }

      .form-control:focus {
        border-color: #fd551d;
        box-shadow: 0 0 0.2rem 0.2rem rgba(253, 85, 29, 0.25);
      }

      @media (max-width: 900px) {
        .contact-form {
          flex-direction: column !important;
          height: auto !important;
        }

        .square {
          width: 0.5rem;
          height: 0.5rem;
        }
      }
    </style>
  </head>
  <body data-bs-theme="dark">
    <div
      class="contact-form vh-100 container-fluid d-flex justify-content-center p-5 align-items-center gap-5 wrap"
    >
      <div class="square square-one"></div>
      <div class="square square-two"></div>
      <div class="square square-three"></div>
      <div class="square square-four"></div>

      <div class="contact-message w-100">
        <h2 class="">
          Tell us what to <br />
          add to the app!!
        </h2>
      </div>
      <form action="" class="w-100">
        <div class="form row gy-5">
          <div class="col-12 col-md-6">
            <label for="first" class="form-label">First name</label>
            <input
              type="text"
              id="first"
              class="form-control border border-0 border-bottom rounded-0"
              placeholder="Your first name"
            />
          </div>

          <div class="col-12 col-md-6">
            <label for="last" class="form-label">Last name</label>
            <input
              type="text"
              id="last"
              class="form-control border border-0 border-bottom rounded-0"
              placeholder="Your last name"
            />
          </div>

          <div class="col-12 col-md-6">
            <label for="subject" class="form-label">Subject</label>
            <input
              type="text"
              id="subject"
              class="form-control border border-0 border-bottom rounded-0"
              placeholder="Your subject"
            />
          </div>

          <div class="col-12 col-md-6">
            <label for="user" class="form-label">Email address</label>
            <input
              type="email"
              id="user"
              class="form-control border border-0 border-bottom rounded-0"
              placeholder="Your email address"
            />
          </div>

          <div class="col-12">
            <label for="message" class="form-label">Message</label>
            <textarea
              name=""
              id="message"
              class="form-control border border-0 border-bottom rounded-0"
              placeholder="Give us as much information as possible about the project"
              rows="4"
            ></textarea>
          </div>

          <button
            type="submit"
            class="col-12 col-md-1 btn border-0 rounded-0 fw-semibold"
          >
            SEND
          </button>
        </div>
      </form>
    </div>

    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>
  </body>
</html>
